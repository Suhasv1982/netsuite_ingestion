bundle:
  name: netsuite_ingestion

include:
  - resources/*.yml

variables:
  catalog:
    description: UC catalog that will hold the poc_bronze / poc_silver / poc_reject schemas
    default: poc_netsuite
  source_pg_host:
    description: Lakebase Postgres endpoint host for the netsuite-sample project (source data)
    default: ep-orange-mountain-d84ghrmd.database.us-east-2.cloud.databricks.com
  meta_pg_host:
    description: Lakebase Postgres endpoint host for the aidq-metadata project (control tables)
    default: ep-withered-pond-d8augt33.database.us-east-2.cloud.databricks.com
  meta_pg_endpoint:
    description: Lakebase endpoint resource path of the metadata database (used to mint the OAuth credential)
    default: projects/aidq-metadata/branches/production/endpoints/primary
  secret_scope:
    description: >
      Secret scope holding the database credentials that refresh_credentials writes and every task reads.
      One scope per environment (docs/phase2_cicd_plan.md, section 3a), so each CI identity gets WRITE on
      its own scope only: dev netsuite_ingestion_dev, prod netsuite_ingestion_prod. The default is the old
      shared scope, which stays until the first prod release on the new scope has run.
    default: netsuite_ingestion_poc
  meta_pg_token_key:
    description: >
      Secret key (in scope netsuite_ingestion_poc) holding the metadata-database credential. Differs per
      target so a dev run can never overwrite the credential that prod reads.
    default: meta_pg_token
  pg_user:
    description: Postgres user for both Lakebase endpoints (OAuth database credential subject)
    default: ${workspace.current_user.userName}
  wake_lakebase_endpoints:
    description: >
      "true": the job's first task re-enables a disabled Lakebase endpoint (source, metadata) before use and logs it
      (src/netsuite_ingestion/lakebase_wake.py; owner decision 2026-10-13). Dev only; prod keeps failing on a
      disabled endpoint until a prod decision.
    default: "false"
  bronze_rebuild:
    description: >
      "true" ONLY for the one full refresh that rebuilds bronze from the source (e.g. the migration
      to the single streaming bronze table, or a recovery). It makes bronze.py ignore the key ledger
      and define no top-up flows, and makes sync_ledger rebuild the ledger. Leave "false" for every
      normal run; a normal run must never be a full refresh.
    default: "false"
  flow_scope:
    description: >
      "pending_only" (default) defines once-flows only for dates missing from the key ledger, plus
      top-ups for late rows. "all_dates" defines a flow for every source date on every run; it costs
      ~0.45 s of planning per flow (1,600 flows = ~12 min), so it is only for small date counts.
    default: "pending_only"
  schedule_pause_status:
    description: >
      UNPAUSED to let netsuite_ingestion_daily actually run on its cron schedule, PAUSED to keep it defined but
      inactive. An explicit value is honored in development mode too (only schedules left unset are paused there).
      promote-prod always deploys prod with PAUSED unless its schedule_pause_status input says otherwise.
    default: "PAUSED"
  daily_cron:
    description: >
      Quartz cron (UTC) of netsuite_ingestion_daily. Staggered after the source generator (05:00 UTC):
      dev 05:30, prod 06:30.
    default: "0 30 6 * * ?"
  notification_email:
    description: >
      Address that gets an email when a daily dev job (generator, netsuite_ingestion_daily) fails. Set in CI from the
      NOTIFICATION_EMAIL repository variable (no address in the repository).
    default: ""
  data_generator_sp:
    description: >
      Application id of the data-generator service principal, the run identity of the dev-only source generator job
      (netsuite_daily_generator). Set in CI from the DATA_GENERATOR_SP repository variable.
    default: ""
  dq_agent_sp:
    description: >
      Application id of the dq-agent service principal, the run identity of the dev-only DQ recommender job
      (dq_recommender; plan #39 step 10). Set in CI from the DQ_AGENT_SP repository variable.
    default: ""

targets:
  dev:
    mode: development
    default: true
    # Dev is deployed by CI only (deploy-dev, as ci-dev), which then also runs it. run_as is explicit because the
    # pipelines API cannot unset a run_as once it is set (the step A spike set it on the [dev ci_dev] pipelines).
    # Do not deploy dev by hand: it would create a second dev set writing the tables the CI pipeline owns.
    run_as:
      service_principal_name: ${workspace.current_user.userName}
    variables:
      # dev writes to its own schemas in the `workspace` catalog: the prod pipeline owns the tables in poc_netsuite
      # (a catalog cannot be created through the API on Default Storage).
      catalog: workspace
      # dev reads and writes the `dev` branch of aidq-metadata (copy-on-write of production, created 2026-09-26)
      meta_pg_endpoint: projects/aidq-metadata/branches/dev/endpoints/primary
      meta_pg_host: ep-aged-cell-d8guvji9.database.us-east-2.cloud.databricks.com
      meta_pg_token_key: meta_pg_token_dev
      secret_scope: netsuite_ingestion_dev
      # daily dev run at 05:30 UTC, after the generator (05:00); unpaused (owner decision 2026-10-01)
      daily_cron: "0 30 5 * * ?"
      schedule_pause_status: "UNPAUSED"
      wake_lakebase_endpoints: "true"
    resources:
      jobs:
        # The source system: appends one day of synthetic NetSuite data (low defect rate) to netsuite-sample
        # (shared by dev and prod; owner decision 2026-10-01). Dev-only resource, runs as data-generator, whose
        # only rights are SELECT/INSERT on the source tables (+UPDATE on customers) and CREATE on the database for
        # its netsuite_backup_daily_* schemas (grants/source.yml).
        netsuite_daily_generator:
          name: netsuite_daily_generator
          description: Daily synthetic increment for the netsuite-sample source (docs/dev_daily_schedule.md)
          run_as:
            service_principal_name: ${var.data_generator_sp}
          schedule:
            quartz_cron_expression: "0 0 5 * * ?"
            timezone_id: UTC
            pause_status: UNPAUSED
          max_concurrent_runs: 1
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          tasks:
            - task_key: generate_increment
              spark_python_task:
                python_file: tools/netsuite_gen.py
                parameters:
                  - "--increment"
                  - "--seed"
                  - "{{job.run_id}}"
                  - "--batch-date"
                  - "{{job.start_time.iso_date}}"
                  - "--config"
                  - "increment_daily.yaml"  # resolved next to netsuite_gen.py
                  - "--auth"
                  - "sdk"
                  - "--backup"
                  - "schema"
                  - "--backup-keep"
                  - "7"
                  - "--update-spread-days"
                  - "0"
                  # generate every day, also on dates the source already holds (owner, 2026-10-01); a same-day
                  # re-run never writes twice
                  - "--allow-before-watermark"
                  - "--skip-if-batch-exists"
                  - "--manifest"
                  - "/tmp/netsuite_daily_manifest.json"
                  # ground truth for the DQ recommender eval (tools/manifest_table.py); the /tmp file is discarded
                  - "--manifest-table"
                  - "workspace.generator.manifests"
              environment_key: generator
          environments:
            - environment_key: generator
              spec:
                client: "3"
                dependencies:
                  - faker>=30
                  - pyyaml
                  # plain psycopg on the runtime's libpq: the psycopg-binary 3.3 wheel aborts the interpreter
                  # (SIGABRT on import) in this serverless environment (probed 2026-10-01)
                  - psycopg>=3.1
                  - databricks-sdk>=0.94.0
        # The DQ rule recommender (plan #39 step 10; docs/dq_recommender_design.md). Dev-only, runs as dq-agent
        # (Postgres role aidq_agent: SELECT, INSERT on config_proposals and incidents; UC SELECT on bronze, silver,
        # rejects; warehouse CAN_USE). Manual runs only for now (the design's weekly trigger comes after the first
        # reviewed cycle). Dry run unless started with write=true.
        dq_recommender:
          name: dq_recommender
          description: DQ rule recommender, run as dq-agent (docs/phase5_dq_recommender_plan.md step 10)
          run_as:
            service_principal_name: ${var.dq_agent_sp}
          max_concurrent_runs: 1
          parameters:
            - name: write
              default: "false"
            # one MLflow trace per run (plan #39 step 8); an empty value turns tracing off
            - name: trace_experiment
              default: /Shared/aidq/dq_recommender
          tasks:
            - task_key: recommend
              spark_python_task:
                python_file: src/dq_recommender_job.py
                parameters: ["--write", "{{job.parameters.write}}",
                             "--trace-experiment", "{{job.parameters.trace_experiment}}"]
              environment_key: dq_agent
          environments:
            - environment_key: dq_agent
              spec:
                client: "3"
                dependencies:
                  - langgraph>=1.2,<2
                  - mcp>=2.3,<3          # tool definitions (aidq_mcp.server); no MCP subprocess in the job
                  - anthropic>=1.11,<2   # imported by aidq_agent.dbx (the shared chat client)
                  - databricks-sdk>=0.147,<1
                  - psycopg>=3.1         # plain psycopg: the binary wheel aborts here (generator, 2026-10-01)
                  - pyyaml
                  - mlflow-skinny>=3.11.1,<4   # tracing to a Unity Catalog trace location (step 8)
        # The validator for PENDING proposals (tools/validate_proposals.py), run as the deploying identity (ci-dev),
        # which does SET LOCAL ROLE aidq_validator before any work. Manual, after a dq_recommender write run.
        dq_validator:
          name: dq_validator
          description: Validates PENDING DQ proposals as aidq_validator (docs/phase5_dq_recommender_plan.md step 5)
          max_concurrent_runs: 1
          tasks:
            - task_key: validate
              spark_python_task:
                python_file: tools/validate_proposals.py
                parameters: ["--auth", "sdk"]
              environment_key: validator
          environments:
            - environment_key: validator
              spec:
                client: "3"
                dependencies:
                  - sqlglot>=30,<31
                  - databricks-sdk>=0.147,<1
                  - psycopg>=3.1
                  - pyyaml
        # failure email for the daily dev ingestion job too (merged into the job in resources/)
        netsuite_ingestion_daily:
          email_notifications:
            on_failure:
              - ${var.notification_email}
    # data-generator and dq-agent must read their jobs' files in the deploying identity's bundle folder
    permissions:
      - service_principal_name: ${var.data_generator_sp}
        level: CAN_VIEW
      - service_principal_name: ${var.dq_agent_sp}
        level: CAN_VIEW

  prod:
    mode: production
    # Prod is deployed by the promote-prod workflow only, as the ci-prod service principal, which is then also the
    # run identity (run_as). Like dev, no id is hard-coded: the deploying service principal is
    # ${workspace.current_user.userName}.
    # No `permissions` block: bundle permissions replace the whole ACL, which for the pipeline means changing its
    # owner, and on Free Edition only a metastore admin (System user) may change a pipeline's owner. Access is set
    # directly instead (docs/STATUS.md): ci-prod owns the job and the canary, has CAN_MANAGE on the pipeline (owned by
    # the workspace owner), and workspace admins keep CAN_MANAGE.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${workspace.current_user.userName}
    variables:
      schedule_pause_status: "UNPAUSED"
      # 06:30 UTC, one hour after dev (owner decision 2026-10-08). The deployed prod job keeps its old 06:00 cron
      # until the next approved promote-prod; the prod schedule stays PAUSED until then.
      daily_cron: "0 30 6 * * ?"
      # one scope per environment (plan section 3a); ci-prod has WRITE on it and nothing else
      secret_scope: netsuite_ingestion_prod
