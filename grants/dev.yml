# Unity Catalog grants the dev target needs. Applied by tools/apply_grants.py in deploy-dev (additive: missing
# privileges are granted, nothing is ever revoked). Principals: `ci` = the deploying service principal (ci-dev),
# `owner` = the GRANT_OWNER_PRINCIPAL GitHub Actions variable (the workspace owner, who reads the dev tables now that
# the pipeline's run identity owns them). workspace.default is not managed here: it holds other projects' tables.
catalog: workspace
grants:
  - principal: ci
    schemas: [poc_bronze, poc_silver, poc_reject, poc_gold, ledger, canary]
    privileges: [USE_SCHEMA, CREATE_TABLE, CREATE_MATERIALIZED_VIEW, SELECT, MODIFY]
  - principal: owner
    schemas: [poc_bronze, poc_silver, poc_reject, poc_gold, ledger, canary]
    privileges: [USE_SCHEMA, SELECT]

  # Generator defect manifests (ground truth for the DQ recommender eval, docs/dq_recommender_design_v2.md section 9):
  # the daily generator job, as data-generator, writes workspace.generator.manifests. The owner creates the schema
  # and applies this entry (tools/apply_grants.py --owner-applied): ci-dev can grant neither on the catalog nor on
  # a schema it does not own.
  - principal: data_generator
    applied_by: owner
    optional: true
    catalog_privileges: [USE_CATALOG]
    schemas: [generator]
    privileges: [USE_SCHEMA, CREATE_TABLE, SELECT, MODIFY]

  # dq-agent, the DQ recommender's service principal (docs/dq_recommender_design_v2.md section 3): read bronze, silver
  # and rejects, use the SQL warehouse for profiling. Owner-applied (tools/setup_dq_roles.sh): CI can grant neither
  # USE CATALOG nor without the principal. No grant on the databricks-gpt-oss-120b endpoint: it is a pay-per-token
  # foundation-model endpoint with no permissions object, open to every workspace user (checked 2026-10-08).
  - principal: agent
    applied_by: owner
    optional: true
    catalog_privileges: [USE_CATALOG]
    schemas: [poc_bronze, poc_silver, poc_reject]
    privileges: [USE_SCHEMA, SELECT]
    warehouses:
      - {name: Serverless Starter Warehouse, level: CAN_USE}

# Postgres group roles on the dev metadata branch (aidq-metadata/dev, schema aidq_metadata) for the DQ recommender.
# Not in a migration: migrations are schema only and also run on prod. Created and granted by the owner
# (tools/dq_roles.py --apply, run by tools/setup_dq_roles.sh); tools/dq_roles.py --check verifies the exact set.
# Members use the principal types above. None of these roles is a member of aidq_owner.
metadata_roles:
  aidq_agent:          # the LLM-driven agent: read, and propose; never update
    members: [agent]
    select_all: true
    insert: [config_proposals, incidents]
  aidq_validator:      # the validator job runs as ci-dev and does SET ROLE aidq_validator before any work
    members: [ci]
    select_all: true
    update:
      config_proposals: [status, validation_result]
  aidq_reviewer:       # tools/review.py, run by a person
    members: [owner]
    select_all: true
    update:
      config_proposals: [status, reviewed_by, reviewed_at, review_comment, approved_severity]
    execute: ["apply_proposal(bigint, text)"]
  aidq_llm_logger:     # writers of the LLM call log (src/aidq_llm, migration 007): add rows, prune rows older than 90 days
    members: [ci, agent]
    insert: [llm_calls]
    execute: ["prune_llm_calls(integer)"]

# "Service Principal User" (roles/servicePrincipal.user): who may deploy a job that runs as the service principal
# (`run_as`). Owner-applied (tools/sp_roles.py --apply, run by tools/setup_dq_roles.sh); tools/sp_roles.py --check
# verifies the exact holders. Display names, resolved at runtime.
service_principal_users:
  data-generator: [ci-dev]   # the generator job (granted 2026-10-01; listed here so the check covers it)
  dq-agent: [ci-dev]         # the DQ recommender job, run_as dq-agent (plan #39 step 10; decided 2026-10-08)
