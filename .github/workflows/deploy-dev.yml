name: Deploy dev

# On every merge to main (and on demand): apply pending migrations to the dev metadata branch, deploy the bundle
# to the dev target, then one normal job run as a smoke test. Everything runs as the ci-dev service principal
# (OAuth M2M). Order matters: migrations before code (docs/phase2_cicd_plan.md, section 4).
# A green run of this workflow for a commit is one of promote-prod's release conditions.
# Never switch the trigger to pull_request_target (CLAUDE.md). Third-party actions are pinned to commit SHAs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    name: deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shared with every job that calls the workspace; never cancels a running deploy.
    concurrency:
      group: databricks-workspace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/databricks-cli   # pinned CLI, checksum verified

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install migration runner dependency
        run: python -m pip install -q "psycopg[binary]>=3.1"

      # Stops the release before any code changes if a migration fails or an applied file was edited.
      - name: Migrations (dev metadata)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set -euo pipefail
          { echo '### Migrations (dev)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python tools/migrate.py --env dev --plan | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/migrate.py --env dev --apply | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: bundle deploy -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set -euo pipefail
          databricks bundle deploy -t dev 2>&1 | grep -v '^Uploading' | tee deploy.log
          { echo '### bundle deploy -t dev'; echo '```'; grep -E '^(Resources|Files|Deployment)' deploy.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # One normal run (never a full refresh). Run-page URLs carry the workspace id and this repo's logs are
      # public, so URLs are stripped from what is printed.
      - name: Smoke run (netsuite_ingestion_daily, dev)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set +e -o pipefail
          databricks bundle run netsuite_ingestion_daily -t dev > run.log 2>&1
          status=$?
          sed -E 's#https?://[^ ]+#<url>#g' run.log | tail -40
          { echo '### Smoke run'; echo '```'; sed -E 's#https?://[^ ]+#<url>#g' run.log | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
