name: Deploy dev

# On every merge to main (and on demand): apply pending migrations to the dev metadata branch, deploy the bundle
# to the dev target, then one normal job run as a smoke test. Everything runs as the ci-dev service principal
# (OAuth M2M). Order matters: migrations before code (docs/phase2_cicd_plan.md, section 4).
# A green run of this workflow for a commit is one of promote-prod's release conditions.
#
# Bronze rebuild mode (deploy with bronze_rebuild=true, run, then always redeploy with bronze_rebuild=false) is used
# when asked for (workflow_dispatch input) or when workspace.poc_bronze holds no streaming table: a fresh dev must
# not plan from a ledger that describes tables that no longer exist. In that mode bronze.py ignores the ledger and
# loads every source date, and sync_ledger rebuilds workspace.ledger.* from the new bronze. The run is a normal
# update when bronze is new and a full refresh only when bronze already exists.
# Never switch the trigger to pull_request_target (CLAUDE.md). Third-party actions are pinned to commit SHAs.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bronze_rebuild:
        description: Rebuild bronze and the key ledger from the source (full refresh if bronze exists)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shared with every job that calls the workspace; never cancels a running deploy.
    concurrency:
      group: databricks-workspace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/databricks-cli   # pinned CLI, checksum verified

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install migration runner dependency
        run: python -m pip install -q "psycopg[binary]>=3.1" pyyaml

      # Stops the release before any code changes if a migration fails or an applied file was edited.
      - name: Migrations (dev metadata)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set -euo pipefail
          { echo '### Migrations (dev)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python tools/migrate.py --env dev --plan | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/migrate.py --env dev --apply | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The source generator's Postgres rights must match grants/source.yml exactly (nothing missing, nothing extra:
      # no DELETE/TRUNCATE, UPDATE only on customers). Read-only check as ci-dev; the owner applies changes.
      - name: Verify source grants (data-generator)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATA_GENERATOR_SP: ${{ vars.DATA_GENERATOR_SP }}
        run: |
          set -euo pipefail
          { echo '### Source grants (data-generator)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python tools/apply_pg_grants.py --check | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Bronze mode (normal or rebuild)
        id: mode
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          REQUESTED: ${{ inputs.bronze_rebuild || false }}
        run: |
          set -euo pipefail
          streaming=$(databricks tables list workspace poc_bronze -o json             | python3 -c "import json,sys; s=sys.stdin.read().strip(); print(sum(t.get('table_type') == 'STREAMING_TABLE' for t in (json.loads(s) if s else [])))")
          if [ "$REQUESTED" = "true" ] || [ "$streaming" -eq 0 ]; then rebuild=true; else rebuild=false; fi
          if [ "$rebuild" = "true" ] && [ "$streaming" -gt 0 ]; then full_refresh=true; else full_refresh=false; fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "full_refresh=$full_refresh" >> "$GITHUB_OUTPUT"
          echo "### Bronze mode: rebuild=$rebuild full_refresh=$full_refresh (requested=$REQUESTED, streaming tables in poc_bronze: $streaming)" >> "$GITHUB_STEP_SUMMARY"

      - name: bundle deploy -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          REBUILD: ${{ steps.mode.outputs.rebuild }}
          BUNDLE_VAR_data_generator_sp: ${{ vars.DATA_GENERATOR_SP }}
          BUNDLE_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
        run: |
          set -euo pipefail
          databricks bundle deploy -t dev --var="bronze_rebuild=${REBUILD}" 2>&1 | grep -v '^Uploading' | tee deploy.log
          { echo '### bundle deploy -t dev'; echo '```'; grep -E '^(Resources|Files|Deployment)' deploy.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Unity Catalog grants this target needs (grants/dev.yml). Additive: grants what is missing, never revokes.
      - name: Apply grants (dev)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          GRANT_OWNER_PRINCIPAL: ${{ vars.GRANT_OWNER_PRINCIPAL }}
        run: |
          set -euo pipefail
          { echo '### Grants (dev)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python tools/apply_grants.py --target dev | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # One run: normal, except a full refresh in rebuild mode when bronze already exists (the guard in bronze.py
      # allows that only because the deploy above set bronze_rebuild=true). Run-page URLs carry the workspace id and
      # this repo's logs are public, so URLs are stripped from what is printed.
      - name: Smoke run (netsuite_ingestion_daily, dev)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          FULL_REFRESH: ${{ steps.mode.outputs.full_refresh }}
        run: |
          set +e -o pipefail
          extra=()
          [ "$FULL_REFRESH" = "true" ] && extra=(--pipeline-params full_refresh=true)
          databricks bundle run netsuite_ingestion_daily -t dev "${extra[@]}" > run.log 2>&1
          status=$?
          sed -E 's#https?://[^ ]+#<url>#g' run.log | tail -40
          { echo '### Smoke run'; echo '```'; sed -E 's#https?://[^ ]+#<url>#g' run.log | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Never leave rebuild mode deployed: back to bronze_rebuild=false whether or not the run passed.
      - name: Redeploy with bronze_rebuild=false (rebuild mode only)
        if: always() && steps.mode.outputs.rebuild == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          BUNDLE_VAR_data_generator_sp: ${{ vars.DATA_GENERATOR_SP }}
          BUNDLE_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
        run: |
          set -euo pipefail
          databricks bundle deploy -t dev --var="bronze_rebuild=false" 2>&1 | grep -v '^Uploading' | tail -3
          echo "- redeployed with bronze_rebuild=false" >> "$GITHUB_STEP_SUMMARY"
