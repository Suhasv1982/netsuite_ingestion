name: DQ recommender eval

# The DQ recommender eval (evals/run_dq_eval.py; plan #39 step 9) on GitHub, as ci-dev, so a result does not depend
# on a local machine (owner request 2026-10-14). Live DRY runs only: the agent writes nothing, the validator's checks
# run in-process, nothing is inserted or updated. The report goes to the job summary; the report and its JSON are also
# printed between markers in the log, to be committed to evals/results/ by a person.
# Triggers: manual (workflow_dispatch, from main), or a push to a dq-eval/** branch, which runs that commit's own code
# and this file as it is on that commit (to evaluate a pull request's code before it merges).
# Needs: ci-dev USE SCHEMA + SELECT on workspace.generator (owner-applied, grants/dev.yml).
# Never switch the trigger to pull_request_target (CLAUDE.md). Third-party actions are pinned to commit SHAs.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Live dry runs of the agent
        type: number
        default: 3
  push:
    branches: ["dq-eval/**"]

permissions:
  contents: read

jobs:
  eval:
    name: dq eval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shared with every job that calls the workspace; never cancels a running deploy.
    concurrency:
      group: databricks-workspace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/databricks-cli   # pinned CLI, checksum verified

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -q ".[dev,tools]"

      - name: Run the eval
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          PYTHONPATH: src
          RUNS: ${{ inputs.runs || 3 }}
        run: |
          set -o pipefail
          rc=0
          python evals/run_dq_eval.py --runs "$RUNS" --out eval_out || rc=$?
          for f in eval_out/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          echo "===BEGIN dq_eval md==="; cat eval_out/*.md; echo "===END dq_eval md==="
          echo "===BEGIN dq_eval json==="; cat eval_out/*.json; echo; echo "===END dq_eval json==="
          exit $rc
