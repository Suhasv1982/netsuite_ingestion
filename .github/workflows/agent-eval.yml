name: Agent eval

# The monitor/RCA agent eval (evals/run_agent_eval.py) on GitHub, as ci-dev, with the results always saved as an
# artifact (owner request 2026-10-19: results must not depend on a local file; a crashed local run lost one).
# Replays recorded tool outputs (evals/cassettes): nothing is read from or written to the platform except the model
# calls (free workspace foundation models). Policy (owner 2026-10-19): the affected cases while developing, the full
# suite only before a merge. Do not run while the Free Edition quota is exhausted.
# Trigger: manual only. `gh workflow run agent-eval.yml --ref <branch> -f cases="id1 id2" -f runs=3` runs that
# branch's code (the branch must contain this file).
# Never switch the trigger to pull_request_target (CLAUDE.md). Third-party actions are pinned to commit SHAs.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Case ids separated by spaces (empty = the full suite, before a merge)
        type: string
        default: ""
      runs:
        description: Runs per case
        type: number
        default: 3

permissions:
  contents: read

jobs:
  eval:
    name: agent eval
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Shared with every job that calls the workspace; never cancels a running deploy.
    concurrency:
      group: databricks-workspace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/databricks-cli   # pinned CLI, checksum verified

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -q ".[dev,tools]"

      - name: Run the eval
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          PYTHONPATH: src
          CASES: ${{ inputs.cases }}
          RUNS: ${{ inputs.runs || 3 }}
        run: |
          set -o pipefail
          rc=0
          # CASES is split on spaces on purpose (case ids contain no spaces)
          python evals/run_agent_eval.py --runs "$RUNS" --out eval_out ${CASES:+--cases $CASES} || rc=$?
          for f in eval_out/*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          exit $rc

      - name: Save the results
        if: always()   # a failed or crashed eval keeps whatever it wrote
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-eval-${{ github.run_id }}
          path: eval_out/
          if-no-files-found: warn
          retention-days: 90
