name: Monitor dev

# Phase 4 monitor + RCA agent (docs/phase4_agent_plan.md): after the dev daily job (05:30 UTC), read the day's state
# through the read-only aidq_mcp tools, investigate signals with a free model served on the workspace
# (databricks-gpt-oss-120b), and write new incidents to dev aidq_metadata.incidents. Runs as ci-dev (OAuth M2M).
# The job fails (GitHub emails) only when a new incident was written; healthy days and already-open incidents pass.
# The report goes to the job summary (public repo: tool results are redacted; no hosts, URLs or emails).
# GitHub disables scheduled workflows after 60 days without repo activity: a disabled monitor is a silent gap.
# Never switch the trigger to pull_request_target (CLAUDE.md). Third-party actions are pinned to commit SHAs.

on:
  schedule:
    - cron: "15 6 * * *"     # 06:15 UTC; GitHub may start it some minutes late
  workflow_dispatch:
    inputs:
      write:
        description: Write incidents (off = dry run, report only)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read              # get_recent_deploys reads deploy-dev runs with GITHUB_TOKEN

jobs:
  monitor:
    name: monitor dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shared with every job that calls the workspace; never cancels a running deploy.
    concurrency:
      group: databricks-workspace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/databricks-cli   # pinned CLI, checksum verified

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -q ".[dev,tools]"

      - name: Run the monitor
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
        run: |
          set -o pipefail
          args=(--report-file "$GITHUB_STEP_SUMMARY")
          if [ "$WRITE" = "true" ]; then args+=(--write); fi
          python -m aidq_agent "${args[@]}"
