name: PR checks

# Runs gitleaks (full git history), pytest, `databricks bundle validate` and `migrate --plan` (dev metadata)
# on every pull request into main.
# No deploy, no schema change. Only bundle-validate and migrate-plan read secrets (the low-privilege dev identity); the GitHub token is read-only.
# Never switch the trigger to pull_request_target (CLAUDE.md). Third-party actions are pinned to commit SHAs;
# gitleaks is downloaded at a pinned version and verified against its published checksums.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scan every commit, not just the PR tip
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          V=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          ARCHIVE="gitleaks_${V}_linux_x64.tar.gz"   # keep the published name: sha256sum -c looks the file up by it
          curl -sSfL -o "${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o checksums.txt "${BASE}/gitleaks_${V}_checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks

      - name: Scan the full git history (values redacted)
        run: |
          set -o pipefail
          ./gitleaks git --redact=100 --no-banner . 2>&1 | tee gitleaks.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### gitleaks"
            grep -E "commits scanned|leaks found|no leaks" gitleaks.log | sed 's/^[0-9:APM]* //' || echo "no summary line found"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install ".[dev,tools]"

      - name: Run tests (integration tests skip themselves without NETSUITE_INTEGRATION=1)
        run: python -m pytest -q

  bundle-validate:
    name: bundle validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every job that calls the Databricks workspace shares this group and never cancels a running one
    # (docs/phase2_cicd_plan.md, section 1).
    concurrency:
      group: databricks-workspace
      cancel-in-progress: false
    steps:
      # Fork PRs get no secrets: skip with a visible notice. A same-repo PR without the credential fails,
      # so a missing secret is never mistaken for a pass.
      - name: Check for the dev credential
        id: cred
        env:
          HAVE_CRED: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV != '' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$HAVE_CRED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "::notice title=bundle validate skipped::fork PR, no Databricks credential available"
            echo "### bundle validate: skipped (fork PR, no credential)" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=bundle validate::secret DATABRICKS_CLIENT_SECRET_DEV is not configured"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.cred.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/databricks-cli   # pinned CLI, checksum verified
        if: steps.cred.outputs.run == 'true'

      # Low-privilege dev identity only (ci-dev service principal, OAuth M2M). Host and client id are secrets,
      # not variables, so GitHub masks them: validate prints the identity and workspace path, and this repo's
      # Actions logs are public. Full output is printed only on failure.
      - name: Validate dev and prod targets
        if: steps.cred.outputs.run == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set -uo pipefail
          status=0
          validate() {
            local target="$1"; shift
            if databricks bundle validate -t "$target" "$@" > "validate-$target.log" 2>&1; then
              echo "- \`$target\`: OK" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$target\`: FAILED" >> "$GITHUB_STEP_SUMMARY"
              echo "::group::bundle validate -t $target"; cat "validate-$target.log"; echo "::endgroup::"
              status=1
            fi
          }
          echo "### bundle validate" >> "$GITHUB_STEP_SUMMARY"
          validate dev
          validate prod --var="schedule_pause_status=PAUSED"
          exit $status

  migrate-plan:
    name: migrate plan (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bundle-validate   # same credential check; skipped with it on fork PRs
    if: needs.bundle-validate.result == 'success'
    concurrency:
      group: databricks-workspace
      cancel-in-progress: false
    steps:
      - name: Check for the dev credential
        id: cred
        env:
          HAVE_CRED: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV != '' }}
        run: echo "run=$HAVE_CRED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.cred.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/databricks-cli   # pinned CLI, checksum verified
        if: steps.cred.outputs.run == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.cred.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Read-only: lists applied / pending / changed files and dry-runs each pending file in a transaction that is
      # rolled back (tools/migrate.py). Fails when an applied file was edited or a pending one would fail.
      - name: migrate --plan (dev metadata, rolled back)
        if: steps.cred.outputs.run == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set +e -o pipefail   # capture the plan's exit code after writing the summary
          python -m pip install -q "psycopg[binary]>=3.1"
          { echo '### migrate --plan (dev)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python tools/migrate.py --env dev --plan 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
