name: PR checks

# Runs gitleaks (full git history) and pytest on every pull request into main.
# No deploy, no secrets, read-only token. Third-party actions are pinned to commit SHAs;
# gitleaks is downloaded at a pinned version and verified against its published checksums.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scan every commit, not just the PR tip
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          V=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o gitleaks.tgz "${BASE}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${BASE}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan the full git history (values redacted)
        run: |
          set -o pipefail
          ./gitleaks git --redact=100 --no-banner . 2>&1 | tee gitleaks.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### gitleaks"
            grep -E "commits scanned|leaks found|no leaks" gitleaks.log | sed 's/^[0-9:APM]* //' || echo "no summary line found"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install ".[dev,tools]"

      - name: Run tests (integration tests skip themselves without NETSUITE_INTEGRATION=1)
        run: python -m pytest -q
