id: 2026-10-14_credential_expired_manual_run
title: A manual dev pipeline update failed on an expired database credential
detected: 2026-10-14
occurred: [2026-10-14]
environment: dev
category: credential_expired
severity: low   # one manual update; the scheduled run and the following runs succeeded
incident_id: 6  # written by the monitor as OTHER ("transient execution-environment error"); corrected by the owner

symptoms:
  - pipeline update at 01:11 UTC FAILED in bronze; the event log shows a traceback in bronze.py, line 8
  - the next update (01:13 UTC) and every later run succeeded

evidence:
  - step: who started the update
    query: databricks pipelines list-updates <pipeline id>
    finding: the failed update has cause API_CALL; every scheduled or deploy run has cause JOB_TASK
  - step: the full exception
    query: GET /api/2.0/pipelines/<pipeline id>/events?filter=level='ERROR'   # error.exceptions[].message
    finding: >-
      "Caused by: org.postgresql.util.PSQLException: ERROR: OAuth: User is not authorized" (the monitor's tool
      returned the traceback truncated before this line)
  - step: when the stored credential was last refreshed
    query: databricks jobs list-runs --job-id <dev ingestion job> --expand-tasks   # refresh_credentials end_time
    finding: last successful refresh 2026-10-13 20:44 UTC, 4 h 27 min before the update; credentials last ~60 min

root_cause: >
  Owner ruling 2026-10-14: CREDENTIAL_EXPIRED. The update was started directly on the pipeline (API call), not
  through the dev job, so the job's first task, refresh_credentials, did not run. The pipeline read the source with
  the credential stored in the secret scope, which had expired hours earlier. Running the job's refresh_credentials
  task and starting the update again fixed it. Rule since then (STATUS.md): manual pipeline runs go through the job,
  never directly.

not_the_cause:
  - "a transient execution-environment error (the monitor's original diagnosis; the exception is an OAuth rejection)"
  - "a schema change, a bad DQ rule or a source outage (the next update with a fresh credential succeeded)"
  - "the scheduled 05:30 run failed (it succeeded)"

fix:
  decision: process rule, not code (owner 2026-10-14)
  changes:
    - "STATUS.md: manual pipeline runs go through the dev job (refresh_credentials first), never the pipeline directly"
    - "the monitor gets each failed update's starter and the stored credential's age as deterministic facts
      (get_pipeline_errors.failed_updates, triage.credential_facts)"
  follow_up:
    - incident 6 re-categorized CREDENTIAL_EXPIRED and resolved, with the monitor's original diagnosis kept in
      evidence.resolution

grading:
  must_identify:
    - the failed update was started directly (API call), not through the job, so refresh_credentials did not run first
    - the stored database credential was hours old (about 4.5 h) and had expired (they last about 60 min)
    - the later runs, including the scheduled one, succeeded (no ongoing problem)
  must_not_claim:
    - a transient execution-environment or infrastructure error caused it
    - a schema change, bad rule or source outage caused it
    - the scheduled daily run failed
  tools_expected: [get_pipeline_errors, get_recent_job_runs]
