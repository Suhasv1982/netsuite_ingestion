id: 2026-10-06_scheduler_did_not_fire
title: Daily dev jobs did not run on 2026-10-06
detected: 2026-10-06
occurred: [2026-10-06]
environment: dev
category: orchestration
severity: medium   # a whole day missed; no failure email because nothing ran

symptoms:
  - no run of netsuite_daily_generator (05:00 UTC) or dev netsuite_ingestion_daily (05:30 UTC) on 2026-10-06
  - no failure notification (on_failure never fires for a run that never starts)
  - Lakebase endpoints (source, dev metadata, prod metadata) found disabled; last active 10-05 about 05:32-05:37 UTC

evidence:
  - step: job runs
    query: databricks jobs list-runs --job-id <id>   # both dev jobs
    finding: scheduled SUCCESS runs 10-02..10-05; none on 10-06, not even a failed or skipped one
  - step: schedule settings
    query: databricks jobs get <id>   # settings.schedule
    finding: both UNPAUSED, crons "0 0 5 * * ?" and "0 30 5 * * ?" (UTC)
  - step: did anyone change the jobs?
    query: |
      SELECT event_time, action_name, user_identity.email FROM system.access.audit
      WHERE service_name = 'jobs' AND event_date >= '2026-10-04'
        AND action_name NOT IN ('runStart','runSucceeded','runTriggered','getRunOutput','listRuns','get','list','getRun');
    finding: no update/reset/schedule change; only changeJobAcl on other job ids
  - step: did deploy-dev run?
    query: gh run list --workflow deploy-dev.yml
    finding: last run 2026-10-01 20:56 UTC
  - step: did the scheduler try?
    query: |
      SELECT action_name, min(event_time) FROM system.access.audit
      WHERE service_name = 'jobs' AND to_json(request_params) RLIKE '<generator id>|<dev job id>'
        AND event_date >= '2026-10-05' GROUP BY 1;
    finding: 10-05 has runTriggered -> runStart -> runSucceeded for both; 10-06 has no event at all
  - step: workspace activity
    query: SELECT service_name, action_name, min(event_time), max(event_time) FROM system.access.audit WHERE event_time >= '2026-10-05 07:00' GROUP BY ALL;
    finding: almost nothing from 10-05 13:44 until an interactive login 10-06 14:40

root_cause: >
  Platform cause (owner ruling 2026-10-06): the Databricks job scheduler did not trigger either job on 10-06.
  The schedules were active and unchanged; there was no deploy and no config change. Free Edition suspending an
  idle workspace is suspected (Lakebase endpoints were disabled in the same window, also with no audit event),
  not confirmed.
  Update 2026-10-13: schedules do NOT reliably come back on their own. The scheduler skipped again on 10-11, 10-12
  and 10-13 (three days; no runTriggered event, schedules UNPAUSED and unchanged, no deploy), with the source and
  dev metadata endpoints disabled on 10-11 and workspace audit activity down from ~60-90k events/day to ~3.7k.
  On 10-06 runs resumed after an interactive login; on 10-13 the jobs ran only when started by hand. Matches
  community reports of idle Free Edition workspaces being deactivated (denyReason INACTIVE, "only a manual Start in
  the console reactivates it"); the official limitations page only documents fair-usage quotas and deletion of
  inactive accounts. Still suspected, not confirmed.

recurrence:
  - occurred: [2026-10-11, 2026-10-12, 2026-10-13]
    finding: no runTriggered for either dev job; schedules UNPAUSED, unchanged since the 10-08 deploy; endpoints
      disabled 10-11 (no audit event); runs resumed only when started by hand on 10-13
    note: the GitHub monitor ran each day but crashed on the disabled metadata endpoint, so the missed runs were
      never reported (fixed by the "monitor never loses its report" change)
not_the_cause:
  - "deploy-dev paused the dev schedules on 10-05 (no deploy-dev run after 10-01; schedules UNPAUSED; no job update in the audit log)"
  - a failing job (there is no run at all, so no failure)
  - the disabled Lakebase endpoints (a run that started would fail on them, but no run started)

fix:
  decision: none in code; record as platform cause
  changes: []
  follow_up:
    - a missing scheduled run is a silent gap; the daily check (and the future monitor) must alert on "no run", not only on "failed run"
    - verify the next scheduled 05:00 run fires
    - "schedules do not reliably resume by themselves (2026-10-11..13): keep the monitor on GitHub as an external
      watchdog (owner decision 2026-10-13), and re-enable disabled Lakebase endpoints before use"
  verification: >
    10-07..10-10 fired normally; 10-11..10-13 skipped again (see recurrence). Not resolved: the platform cause is
    outside the pipeline.

grading:
  must_identify:
    - no run was triggered (absence, not failure)
    - schedules were UNPAUSED and unchanged
    - no deploy or config change explains it, so it is outside the pipeline (platform)
  must_not_claim:
    - deploy-dev paused the schedules
    - the job failed
    - a specific confirmed platform cause (it is suspected only)
    - the schedules were or may have been paused (they were UNPAUSED and unchanged; owner 2026-10-13)
  tools_expected: [get_recent_job_runs, get_recent_deploys]
