# Agent eval cases: recorded tool outputs (evals/cassettes) + what the monitor must do with them.
# `fixture` points at evals/incidents/<id>.yaml, whose grading.must_identify / must_not_claim the judge checks.
cases:
  - id: healthy_2026-10-09
    cassette: 2026-10-09_after_daily_run
    now: "2026-10-09T12:00:00+00:00"
    expect_incident: false
    note: first scheduled cycle after the row-hash fix; both daily runs succeeded, bronze = source (same-day versions are info only)

  - id: duplicate_versions
    cassette: 2026-10-05_pre_fix
    now: "2026-10-05T12:00:00+00:00"
    expect_incident: true
    categories: [DATA_COMPLETENESS]
    fixture: 2026-10-02_same_day_duplicate_versions
    design_notes: evals/design_notes/2026-10-06.md   # the platform as it was then: ledger keyed on (key, date)
    note: the same state as seen before PR #27 (every gap unexplained)

  - id: missed_runs
    cassette: 2026-10-06_afternoon
    now: "2026-10-06T14:45:00+00:00"
    expect_incident: true
    categories: [ORCHESTRATION]
    fixture: 2026-10-06_scheduler_did_not_fire

  - id: missed_runs_metadata_unavailable
    cassette: 2026-10-06_afternoon
    now: "2026-10-06T14:45:00+00:00"
    expect_incident: true
    categories: [ORCHESTRATION]
    fixture: 2026-10-06_scheduler_did_not_fire
    store: unavailable    # the incident store raises (disabled metadata endpoint, 2026-10-11..13)
    note: the diagnosis must still be complete in the report, and the run marked failed (exit 2)
