[project]
name = "netsuite_ingestion"
version = "0.0.1"

[project.optional-dependencies]
dev = [
    "pytest",
]
# tools/netsuite_gen.py -- synthetic data generator for the netsuite-sample
# Lakebase project. Not needed by the pipeline itself.
tools = [
    "faker>=30",
    "pyyaml",
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["src/netsuite_ingestion", "tools"]
